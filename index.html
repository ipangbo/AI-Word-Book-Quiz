<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ADDED viewport-fit=cover -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- iOS PWA & Status Bar Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CineVocab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- 
       CRITICAL FIX: 
       We define specific meta tags for light and dark mode initially so Safari knows what to do 
       BEFORE JS runs. The JS will later take over control of 'theme-color-meta' for dynamic switching.
    -->
    <meta name="theme-color" content="#FDF7FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)" />
    <!-- This ID is used by our JS to update the color dynamically later -->
    <meta name="theme-color" content="#FDF7FF" id="theme-color-meta" />

    <!-- Favicons for Browser Tabs and Safari/iOS Home Screen -->
    <link rel="icon" type="image/png" href="https://tc1.ipangbo.cn/s3/cropped-icanicon-1.png" />
    <link rel="apple-touch-icon" href="https://tc1.ipangbo.cn/s3/cropped-icanicon-1.png" />

    <title>CineVocab</title>
    
    <!-- PRE-LOAD THEME SCRIPT -->
    <script>
      (function() {
        try {
          var metaTag = document.getElementById('theme-color-meta');
          var savedMode = localStorage.getItem('cinevocab_theme_mode');
          var savedTheme = localStorage.getItem('cinevocab_theme_name') || 'violet';
          
          var lightSurfaces = {
            'violet': '#FDF7FF', 'ocean': '#F4FBFC', 'nature': '#F6FBF3', 'volcano': '#FFF8F6', 'custom': '#FAFAFA'
          };
          var darkSurfaces = {
            'violet': '#141218', 'ocean': '#001F26', 'nature': '#10140F', 'volcano': '#201A19', 'custom': '#141414'
          };

          var isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          // Logic: If saved is 'dark', OR saved is 'system' and system is dark, OR no save and system is dark.
          var isDark = savedMode === 'dark' || (savedMode === 'system' && isSystemDark) || (!savedMode && isSystemDark);

          var colorMap = isDark ? darkSurfaces : lightSurfaces;
          var initialColor = colorMap[savedTheme] || (isDark ? '#141218' : '#FDF7FF');

          if (metaTag) {
            metaTag.setAttribute('content', initialColor);
          }
          
          // Force immediate paint
          document.documentElement.style.backgroundColor = initialColor;
          document.body.style.backgroundColor = initialColor;
          
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { console.error('Theme preload failed', e); }
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', 
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto', 'sans-serif'],
            },
            colors: {
              'md-surface': 'var(--md-surface)',
              'md-surface-container': 'var(--md-surface-container)',
              'md-on-surface': 'var(--md-on-surface)',
              'md-primary': 'var(--md-primary)',
              'md-on-primary': 'var(--md-on-primary)',
              'md-primary-container': 'var(--md-primary-container)',
              'md-on-primary-container': 'var(--md-on-primary-container)',
              'md-secondary-container': 'var(--md-secondary-container)',
              'md-on-secondary-container': 'var(--md-on-secondary-container)',
              'md-outline': 'var(--md-outline)',
              'md-error': 'var(--md-error)',
              'md-error-container': 'var(--md-error-container)',
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* 
         CSS VARIABLES: 
         We provide defaults for BOTH light and dark modes in CSS.
         This ensures the browser paints the correct background COLOR 
         even before JavaScript runs, preventing the "White Flash".
      */
      :root {
        /* Default Light Theme (Violet) */
        --md-surface: #FDF7FF;
        --md-surface-container: #F3EDF7;
        --md-on-surface: #1D1B20;
        --md-primary: #6750A4;
        --md-on-primary: #FFFFFF;
        --md-primary-container: #EADDFF;
        --md-on-primary-container: #21005D;
        --md-secondary-container: #E8DEF8;
        --md-on-secondary-container: #1D192B;
        --md-outline: #79747E;
        --md-error: #B3261E;
        --md-error-container: #F9DEDC;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          /* Default Dark Theme (Violet) - Matches logic in theme.ts */
          --md-surface: #141218;
          --md-surface-container: #211F26;
          --md-on-surface: #E6E1E5;
          --md-primary: #D0BCFF;
          --md-on-primary: #381E72;
          --md-primary-container: #4F378B;
          --md-on-primary-container: #EADDFF;
          --md-secondary-container: #4A4458;
          --md-on-secondary-container: #E8DEF8;
          --md-outline: #938F99;
          --md-error: #F2B8B5;
          --md-error-container: #8C1D18;
        }
      }

      html {
        min-height: 100%;
        /* Use the variable which now adapts to media queries automatically */
        background-color: var(--md-surface);
        /* Critical for removing tap highlight on mobile */
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: var(--md-surface);
        color: var(--md-on-surface);
        /* Note: We removed the background-color transition to prevent 
           flashing when the CSS media query takes effect vs JS loading. 
           We only animate interactions now. */
        transition: color 0.3s ease, border-color 0.3s ease;
        overscroll-behavior-y: none;
        min-height: 100vh;
        padding-top: env(safe-area-inset-top); 
        padding-bottom: env(safe-area-inset-bottom);
      }
      
      input, button, div {
        transition-property: background-color, color, border-color, box-shadow;
        transition-duration: 0.3s;
        transition-timing-function: ease;
      }

      html.dark *, html.dark ::before, html.dark ::after {
        border-color: #374151; 
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--md-secondary-container);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--md-primary);
      }

      @keyframes ripple {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }
      .animate-ripple {
        animation: ripple 600ms linear;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "framer-motion": "https://esm.sh/framer-motion@^12.24.10",
    "canvas-confetti": "https://esm.sh/canvas-confetti@^1.9.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
