<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CineVocab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- 
       FIX: We initialize this with a placeholder. The script below will IMMEDIATELLY update it 
       before the browser parses the body, ensuring the correct color is used for the first paint.
    -->
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />

    <link rel="icon" type="image/png" href="https://tc1.ipangbo.cn/s3/cropped-icanicon-1.png" />
    <link rel="apple-touch-icon" href="https://tc1.ipangbo.cn/s3/cropped-icanicon-1.png" />

    <title>CineVocab</title>
    
    <!-- ENHANCED PRE-LOAD THEME SCRIPT -->
    <script>
      (function() {
        try {
          // 1. Configuration Data (Synced with utils/theme.ts)
          var savedMode = localStorage.getItem('cinevocab_theme_mode');
          var savedTheme = localStorage.getItem('cinevocab_theme_name') || 'violet';
          var savedCustomColor = localStorage.getItem('cinevocab_custom_color');
          
          var lightSurfaces = {
            'violet': '#FDF7FF', 'ocean': '#F4FBFC', 'nature': '#F6FBF3', 'volcano': '#FFF8F6'
          };
          var darkSurfaces = {
            'violet': '#141218', 'ocean': '#001F26', 'nature': '#10140F', 'volcano': '#201A19'
          };

          // 2. Determine Mode
          var isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = savedMode === 'dark' || (savedMode === 'system' && isSystemDark) || (!savedMode && isSystemDark);

          // 3. Determine Color
          var targetColor;
          if (savedTheme === 'custom' && savedCustomColor) {
             // Fallback for custom theme estimation in pre-load (simplified)
             targetColor = isDark ? '#141414' : '#FAFAFA'; 
          } else {
             var map = isDark ? darkSurfaces : lightSurfaces;
             targetColor = map[savedTheme] || (isDark ? '#141218' : '#FDF7FF');
          }

          // 4. Apply to DOM immediately (Critical for Safari PWA Status Bar)
          var metaTag = document.getElementById('theme-color-meta');
          if (metaTag) {
            metaTag.setAttribute('content', targetColor);
          }

          // 5. Apply Backgrounds
          document.documentElement.style.backgroundColor = targetColor;
          document.body ? (document.body.style.backgroundColor = targetColor) : null;
          
          // 6. INJECT CSS VARIABLES IMMEDIATELY
          // This prevents the "Purple Flash" by overriding the :root variables 
          // before the browser paints the default CSS.
          var style = document.createElement('style');
          style.innerHTML = ':root { --md-surface: ' + targetColor + ' !important; background-color: ' + targetColor + ' !important; }';
          document.head.appendChild(style);

          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { console.error('Theme preload failed', e); }
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', 
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto', 'sans-serif'],
            },
            colors: {
              'md-surface': 'var(--md-surface)',
              'md-surface-container': 'var(--md-surface-container)',
              'md-on-surface': 'var(--md-on-surface)',
              'md-primary': 'var(--md-primary)',
              'md-on-primary': 'var(--md-on-primary)',
              'md-primary-container': 'var(--md-primary-container)',
              'md-on-primary-container': 'var(--md-on-primary-container)',
              'md-secondary-container': 'var(--md-secondary-container)',
              'md-on-secondary-container': 'var(--md-on-secondary-container)',
              'md-outline': 'var(--md-outline)',
              'md-error': 'var(--md-error)',
              'md-error-container': 'var(--md-error-container)',
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* 
         Default variables are defined here, BUT the pre-load script above 
         will inject a style tag with !important overrides for --md-surface
         based on local storage. This ensures the correct background color
         is painted on the very first frame.
      */
      :root {
        --md-surface: #FDF7FF; 
        --md-surface-container: #F3EDF7;
        --md-on-surface: #1D1B20;
        --md-primary: #6750A4;
        --md-on-primary: #FFFFFF;
        --md-primary-container: #EADDFF;
        --md-on-primary-container: #21005D;
        --md-secondary-container: #E8DEF8;
        --md-on-secondary-container: #1D192B;
        --md-outline: #79747E;
        --md-error: #B3261E;
        --md-error-container: #F9DEDC;
      }

      html {
        min-height: 100%;
        background-color: var(--md-surface);
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: var(--md-surface);
        color: var(--md-on-surface);
        /* Remove transitions on background to prevent flashing during hydration */
        transition: color 0.3s ease, border-color 0.3s ease;
        overscroll-behavior-y: none;
        min-height: 100vh;
        padding-top: env(safe-area-inset-top); 
        padding-bottom: env(safe-area-inset-bottom);
      }
      
      input, button, div {
        transition-property: background-color, color, border-color, box-shadow;
        transition-duration: 0.3s;
        transition-timing-function: ease;
      }

      html.dark *, html.dark ::before, html.dark ::after {
        border-color: #374151; 
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--md-secondary-container);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--md-primary);
      }

      @keyframes ripple {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }
      .animate-ripple {
        animation: ripple 600ms linear;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",

  }
}
</script>

</head>

    <div id="root"></div>
