
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineVocab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', // Enable class-based dark mode (though we mostly use CSS vars)
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto', 'sans-serif'],
            },
            colors: {
              // Using CSS variables for dynamic theming
              'md-surface': 'var(--md-surface)',
              'md-surface-container': 'var(--md-surface-container)',
              'md-on-surface': 'var(--md-on-surface)',
              'md-primary': 'var(--md-primary)',
              'md-on-primary': 'var(--md-on-primary)',
              'md-primary-container': 'var(--md-primary-container)',
              'md-on-primary-container': 'var(--md-on-primary-container)',
              'md-secondary-container': 'var(--md-secondary-container)',
              'md-on-secondary-container': 'var(--md-on-secondary-container)',
              'md-outline': 'var(--md-outline)',
              'md-error': 'var(--md-error)',
              'md-error-container': 'var(--md-error-container)',
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Default Theme (Violet) */
        --md-surface: #FDF7FF;
        --md-surface-container: #F3EDF7;
        --md-on-surface: #1D1B20;
        --md-primary: #6750A4;
        --md-on-primary: #FFFFFF;
        --md-primary-container: #EADDFF;
        --md-on-primary-container: #21005D;
        --md-secondary-container: #E8DEF8;
        --md-on-secondary-container: #1D192B;
        --md-outline: #79747E;
        --md-error: #B3261E;
        --md-error-container: #F9DEDC;
      }

      body {
        background-color: var(--md-surface);
        color: var(--md-on-surface);
        /* Global smooth transition for theme switching */
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      }
      
      /* Ensure inputs and buttons transition smoothly too */
      input, button, div {
        transition-property: background-color, color, border-color, box-shadow;
        transition-duration: 0.3s;
        transition-timing-function: ease;
      }

      /* FIX: Override Tailwind Preflight Default Border Color for Dark Mode */
      /* The default #e5e7eb is too bright for dark themes, causing "white borders" */
      html.dark *, html.dark ::before, html.dark ::after {
        border-color: #374151; /* gray-700: A neutral dark grey */
      }

      /* Custom scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--md-secondary-container);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--md-primary);
      }

      /* Ripple Animation */
      @keyframes ripple {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }
      .animate-ripple {
        animation: ripple 600ms linear;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "framer-motion": "https://esm.sh/framer-motion@^12.24.10",
    "canvas-confetti": "https://esm.sh/canvas-confetti@^1.9.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
